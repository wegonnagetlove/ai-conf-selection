<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отбор докладов: Технологии ИИ в науке и образовании 2026</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --text:#202124;--gray:#5F6368;--lgray:#9AA0A6;--fill:#F1F3F4;--border:#DADCE0;
  --blue:#4285F4;--red:#EA4335;--yellow:#FBBC04;--green:#34A853;
  --blue-bg:#E8F0FE;--red-bg:#FCE8E6;--yellow-bg:#FEF7E0;--green-bg:#E6F4EA;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--text)}
body{font-family:'Google Sans','Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.25}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 64px}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px}
.eyebrow{font-size:13px;color:var(--gray);margin:0 0 6px}
h1{font-size:30px;font-weight:700;margin:0;letter-spacing:-.2px}
.sub{color:var(--gray);margin:6px 0 0;font-size:15px}
.dots{display:flex;gap:7px;padding-top:6px;flex-shrink:0}
.dots i{width:11px;height:11px;border-radius:50%;display:block}
.whobar{display:flex;gap:14px;align-items:center;justify-content:flex-end;font-size:14px;color:var(--gray);margin-top:10px;min-height:20px}
.status{margin:8px 0 0;font-size:14px;color:var(--gray);min-height:18px}
.status.warn{color:#B06000}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0 26px}
.stat{background:var(--fill);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:30px;font-weight:700;line-height:1.1}
.stat span{color:var(--gray);font-size:13px}
.stat.g b{color:var(--green)}.stat.b b{color:var(--blue)}.stat.y b{color:#B06000}
h2{font-size:19px;font-weight:700;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.folder{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;border:1px solid var(--border);border-radius:14px;padding:16px;background:#fff;transition:border-color .12s}
.folder:hover,.folder:focus-visible{border-color:var(--blue)}
.folder .row{display:flex;gap:12px;align-items:flex-start}
.num{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.num.reg{background:var(--green)}
.num.sum{background:var(--yellow);color:var(--text)}
.folder .name{font-weight:500;font-size:16px}
.folder .site{color:var(--gray);font-size:13px;margin-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--gray)}
.pill{background:var(--fill);border-radius:999px;padding:3px 9px;font-size:12.5px;color:var(--gray);white-space:nowrap}
.pill.g{background:var(--green-bg);color:#137333}.pill.y{background:var(--yellow-bg);color:#B06000}.pill.r{background:var(--red-bg);color:#C5221F}.pill.b{background:var(--blue-bg);color:#1967D2}
.bar{height:6px;background:var(--fill);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.crumbs{display:flex;align-items:center;gap:10px;margin:22px 0 4px}
.back{all:unset;cursor:pointer;color:#1967D2;font-weight:500;font-size:14px}
.back:hover{text-decoration:underline}
.sechead{display:flex;gap:14px;align-items:center;margin:8px 0 16px}
.sechead h2{margin:0;font-size:22px}
.sechead .site{color:var(--gray);font-size:14px;margin-top:3px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.search{flex:1 1 260px;border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:none}
.search:focus{border-color:var(--blue)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13.5px;color:var(--gray)}
.seg button.on{background:var(--blue-bg);border-color:var(--blue);color:#1967D2;font-weight:500}
.list{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;padding:16px 18px;background:#fff}
.card.yes{border-left-color:var(--green)}.card.maybe{border-left-color:var(--yellow)}.card.no{border-left-color:var(--red)}
.card h3{margin:0 0 6px;font-size:16.5px;font-weight:500;line-height:1.3}
.who{font-size:14.5px}
.who b{font-weight:500}
.org{color:var(--gray);font-size:13.5px;margin-top:2px}
.card .meta{margin-top:10px}
details{margin-top:10px;font-size:14px}
summary{cursor:pointer;color:#1967D2;font-size:13.5px}
details p{margin:8px 0 0;color:var(--text);white-space:pre-wrap}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.act{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;color:var(--gray)}
.act:disabled{cursor:default;opacity:.5}
.act.yes.on{background:var(--green);border-color:var(--green);color:#fff}
.act.maybe.on{background:var(--yellow);border-color:var(--yellow);color:var(--text)}
.act.no.on{background:var(--red);border-color:var(--red);color:#fff}
.act.yes:not(.on):hover{border-color:var(--green);color:#137333}
.act.maybe:not(.on):hover{border-color:var(--yellow);color:#B06000}
.act.no:not(.on):hover{border-color:var(--red);color:#C5221F}
.note{width:100%;margin-top:10px;border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-height:38px;resize:vertical;font-size:14px;outline:none}
.note:focus{border-color:var(--blue)}
.others{margin-top:12px;padding-top:10px;border-top:1px solid var(--fill);display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.others .o{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.others .c{color:var(--gray)}
.empty{color:var(--gray);padding:28px;text-align:center;background:var(--fill);border-radius:12px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--gray);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-weight:500;color:var(--gray);font-size:13px;background:var(--fill)}
td.n{white-space:nowrap;text-align:center}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px}
.pdfrow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.pdfrow .btn{text-decoration:none}
.btn.ghost{background:#fff;color:#1967D2}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.decide{margin-top:14px;padding:12px 14px;background:var(--fill);border-radius:12px;display:flex;flex-direction:column;gap:10px}
.decide .lbl{font-size:13px;color:var(--gray);font-weight:500}
.decide .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.decide select,.decide input[type=text],.panel input[type=text],.panel textarea{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:#fff;font-size:14px;outline:none}
.decide select{min-width:260px}
.decide select:focus,.panel input:focus,.panel textarea:focus{border-color:var(--blue)}
.decide label{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.card.dec{border-left-color:var(--blue)}
.panel{border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:18px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:16px;font-weight:500}
.panel .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel textarea{width:100%;min-height:70px;resize:vertical}
.panel input[type=text]{width:100%}
.panel .lbl{font-size:13px;color:var(--gray);margin-bottom:4px}
.olist{display:flex;flex-direction:column;gap:6px}
.oitem{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:14px}
.oitem .t{flex:1}
.oitem .mv{all:unset;cursor:pointer;border:1px solid var(--border);border-radius:8px;width:28px;height:28px;text-align:center;line-height:28px;color:var(--gray)}
.oitem .mv:hover{border-color:var(--blue);color:#1967D2}
.oitem .no{width:24px;text-align:right;color:var(--gray)}
@media (max-width:720px){.panel .grid2{grid-template-columns:1fr}.decide select{min-width:0;width:100%}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}.wrap{padding:20px 14px 48px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Экспертный отбор докладов</p>
      <h1>Технологии ИИ в науке и образовании 2026</h1>
      <p class="sub">Международная конференция. Заявки сгруппированы по секциям. Отметьте доклады, которые вы выбираете для своей секции.</p>
    </div>
    <div class="dots" aria-hidden="true"><i style="background:#4285F4"></i><i style="background:#EA4335"></i><i style="background:#FBBC04"></i><i style="background:#34A853"></i></div>
  </header>
  <div class="whobar" id="who"></div>
  <div id="status" class="status">Загрузка данных…</div>
  <main id="view"></main>
</div>
<div id="toast" class="toast"></div>
<script>
(function(){
"use strict";
var S={sections:[],marks:{},me:null,canWrite:null,readOnly:false,names:{},filter:"all",q:"",loaded:{sec:false,marks:false},
  admin:false,secs:[],observer:false,reviewSecs:[],dec:{},order:{},secinfo:{},labels:{decisions:{},none:"Новая"}};
var DEC_ORDER=["review","oral_off","oral_on","poster","listen_off","listen_on","reject"];
var DEC_SHORT={review:"на рассмотрении",oral_off:"устный очно",oral_on:"устный онлайн",poster:"постер",listen_off:"слушатель очно",listen_on:"слушатель онлайн",reject:"отклонена"};
var FINAL={oral_off:1,oral_on:1,poster:1,listen_off:1,listen_on:1,reject:1};
var LIMIT={oral:7,poster:8};
var myPicks={},dirty=false;
var STAT={yes:"Выбран",maybe:"Под вопросом",no:"Не подходит"};
var STATCLS={yes:"g",maybe:"y",no:"r"};

function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs){for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==="class")el.className=v;else if(k==="text")el.textContent=v;
    else if(k.slice(0,2)==="on")el.addEventListener(k.slice(2),v);else el.setAttribute(k,v===true?"":v);}}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;
    if(Array.isArray(c))c.forEach(function(x){if(x!=null&&x!==false)el.appendChild(typeof x==="string"?document.createTextNode(x):x)});
    else el.appendChild(typeof c==="string"?document.createTextNode(c):c);}
  return el;
}
function setStatus(t,warn){var s=document.getElementById("status");s.textContent=t||"";s.className="status"+(warn?" warn":"");}
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove("show")},2200);}
function str(x){return typeof x==="string"?x:(x==null?"":String(x));}

/* ---------- данные ---------- */
function allReports(){var out=[];S.sections.forEach(function(s){(s.reports||[]).forEach(function(r){out.push(r)})});return out;}
function marksFor(key){var out=[];for(var uid in S.marks){var p=S.marks[uid]&&S.marks[uid][key];if(p&&STAT[p.s])out.push({uid:uid,s:p.s,c:str(p.c)});}
  if(S.me&&myPicks[key]&&STAT[myPicks[key].s]){out=out.filter(function(m){return m.uid!==S.me});out.push({uid:S.me,s:myPicks[key].s,c:str(myPicks[key].c)});}
  else if(S.me){out=out.filter(function(m){return m.uid!==S.me});}
  return out;}
function myMark(key){return myPicks[key]||null;}
function countBy(list,s){return list.filter(function(m){return m.s===s}).length;}
function nameOf(uid){if(uid===S.me)return "Вы";return S.names[uid]||"Эксперт";}

/* ---------- решения кураторов и проверки ---------- */
function canDecide(sec){return S.admin||S.secs.indexOf(sec)>=0;}
function canReview(sec){return !S.observer&&(S.admin||S.secs.indexOf(sec)>=0||S.reviewSecs.indexOf(sec)>=0);}
function isCurator(){return S.admin||S.secs.length>0;}
function personKey(n){var w=str(n).replace(/ё/gi,"е").replace(/[.,]/g," ").trim().split(/\s+/).filter(Boolean);
  if(!w.length)return "";return (w[0]+" "+w.slice(1,3).map(function(x){return x[0]}).join("")).toLowerCase();}
function mine(r){var k=personKey(S.myName);if(!k)return false;return [r.name].concat(r.coauthors||[]).some(function(n){return personKey(n)===k});}
function decOf(key){return S.dec[key]||null;}
// статус на портале «Ломоносов»: без решения куратора заявка остаётся «Новой»
function portalStatus(key){var d=decOf(key);return d&&d.d?str(S.labels.decisions[d.d]):str(S.labels.none||"Новая");}
function isDistant(r){var f=str(r.fmt);return /Докладчик \(дистанционно\)/.test(f)&&!/Докладчик \(очно/.test(f);}
function isPoster(r){return /Постер/.test(str(r.kind));}
var byRid=null;
function ridReports(rid){if(!byRid){byRid={};allReports().forEach(function(x){(byRid[x.rid]=byRid[x.rid]||[]).push(x)});}return byRid[rid]||[];}
function secOf(r){var n=null;S.sections.forEach(function(s){if((s.reports||[]).indexOf(r)>=0)n=s.num});return n;}
// автоматические пометки для куратора: то, что по инструкции проверяется до отбора
function flags(r){
  var f=[],d=decOf(r.key),dd=d&&d.d;
  if(r.over35===true)f.push(["r","старше 35: по инструкции в слушатели"]);
  if(str(r.level)==="Абитуриент")f.push(["y","школьник: проверить класс (10–11)"]);
  if(isPoster(r)&&isDistant(r))f.push(["r","постер + дистанционно: только устный"]);
  if(!/Докладчик/.test(str(r.fmt)))f.push(["y","в заявке нет формата докладчика"]);
  if(!r.pdf)f.push(["r","нет файла тезисов: запросить по почте"]);
  // объём проверяется только по числу страниц (не больше 2), знаки не считаем
  if(r.pages>2)f.push(["r",r.pages+" стр.: больше 2 страниц"]);
  var other=ridReports(r.rid).filter(function(x){return x.key!==r.key});
  if(other.length)f.push(["y","второй доклад автора: секция "+other.map(secOf).join(", ")]);
  if(dd==="poster"&&isDistant(r))f.push(["r","статус «постер», а участник дистанционно"]);
  if(secOf(r)>9&&(dd==="poster"||(!dd&&isPoster(r))))f.push(["r","на региональных площадках постеров нет"]);
  if(mine(r))f.push(["b","ваша заявка: решает другой член оргкомитета"]);
  return f;}
function sectionCounts(s){var c={oral:0,poster:0,none:0,listen:0};
  (s.reports||[]).forEach(function(r){var d=decOf(r.key),dd=d&&d.d;
    if(dd==="oral_off"||dd==="oral_on")c.oral++;else if(dd==="poster")c.poster++;else if(dd==="listen_off"||dd==="listen_on")c.listen++;else if(!FINAL[dd])c.none++;});
  return c;}
function sendDecision(key,patch){
  var cur=decOf(key)||{},next={d:cur.d||null,rev:!!cur.rev,note:str(cur.note)};
  for(var k in patch)next[k]=patch[k];
  S.dec[key]=next;dirty=true;
  return api("PUT","/api/decision",{key:key,d:next.d,rev:next.rev,note:next.note})
    .then(function(){dirty=false;},function(e){dirty=false;if(e.message!=="auth")toast(e.message||"Статус не сохранился");});}

/* ---------- маршрутизация ---------- */
function route(){var hs=(location.hash||"").replace(/^#/,"");
  var m=/^section-(\d+)$/.exec(hs);
  if(m)return {v:"section",n:+m[1]};
  if(hs==="summary")return {v:"summary"};
  return {v:"home"};}
function go(hash){if(location.hash==="#"+hash)render();else location.hash=hash;window.scrollTo(0,0);}
window.addEventListener("hashchange",function(){S.q="";S.filter="all";render();window.scrollTo(0,0);});

/* ---------- отрисовка ---------- */
function render(){
  var v=document.getElementById("view");v.textContent="";
  if(!S.loaded.sec){return;}
  if(!S.sections.length){v.appendChild(h("div",{class:"empty",text:"Список заявок пока не загружен."}));return;}
  var r=route();
  if(r.v==="section"){var s=S.sections.filter(function(x){return x.num===r.n})[0];if(s){renderSection(v,s);return;}}
  if(r.v==="summary"){renderSummary(v);return;}
  renderHome(v);
}

function stats(){var all=allReports(),sel=0,mine=0,maybe=0;
  all.forEach(function(r){var ms=marksFor(r.key);if(countBy(ms,"yes"))sel++;if(countBy(ms,"maybe"))maybe++;if(myMark(r.key))mine++;});
  return {total:all.length,sel:sel,mine:mine,maybe:maybe};}

function renderHome(v){
  var st=stats();
  v.appendChild(h("div",{class:"stats"},
    h("div",{class:"stat b"},h("b",{text:String(st.total)}),h("span",{text:"докладов в заявках"})),
    h("div",{class:"stat g"},h("b",{text:String(st.sel)}),h("span",{text:"выбраны хотя бы одним экспертом"})),
    h("div",{class:"stat y"},h("b",{text:String(st.maybe)}),h("span",{text:"под вопросом"})),
    h("div",{class:"stat"},h("b",{text:String(st.mine)}),h("span",{text:"оценено вами"}))));
  var central=S.sections.filter(function(s){return s.num<=9}),reg=S.sections.filter(function(s){return s.num>9});
  if(central.length){v.appendChild(h("h2",{text:S.admin?"Центральная площадка, секции с 1 по 9":"Центральная площадка"}));
  v.appendChild(grid(central));}
  if(reg.length){v.appendChild(h("h2",{text:"Региональные площадки"}));
  v.appendChild(grid(reg));}
  if(!S.sections.length)v.appendChild(h("p",{text:"Для вашего кода не назначено ни одной секции. Обратитесь к Полине Петрухиной."}));
  v.appendChild(h("h2",{text:"Сводка"}));
  var sumCard=h("button",{class:"folder",onclick:function(){go("summary")}},
    h("div",{class:"row"},h("div",{class:"num sum",text:"Σ"}),
      h("div",null,h("div",{class:"name",text:"Итоги отбора"}),h("div",{class:"site",text:"Все отмеченные доклады по секциям, копирование таблицы"}))));
  v.appendChild(h("div",{class:"grid"},sumCard));
}
function grid(list){
  return h("div",{class:"grid"},list.map(function(s){
    var reps=s.reports||[],sel=0,mine=0;
    reps.forEach(function(r){if(countBy(marksFor(r.key),"yes"))sel++;if(myMark(r.key))mine++;});
    var pct=reps.length?Math.round(mine*100/reps.length):0;
    return h("button",{class:"folder",onclick:function(){go("section-"+s.num)},"aria-label":"Секция "+s.num+". "+str(s.name)},
      h("div",{class:"row"},h("div",{class:"num"+(s.num>9?" reg":""),text:String(s.num)}),
        h("div",null,h("div",{class:"name",text:str(s.name)}),h("div",{class:"site",text:str(s.site)}))),
      h("div",{class:"meta"},h("span",{class:"pill",text:reps.length+" "+plural(reps.length,"доклад","доклада","докладов")}),
        sel?h("span",{class:"pill g",text:"выбрано "+sel}):null,
        h("span",{class:"pill b",text:"оценено вами "+mine+" из "+reps.length})),
      h("div",{class:"bar"},h("i",{style:"width:"+pct+"%"})));
  }));
}
function plural(n,a,b,c){var m=n%10,mm=n%100;if(m===1&&mm!==11)return a;if(m>=2&&m<=4&&(mm<10||mm>=20))return b;return c;}

function renderSection(v,s){
  v.appendChild(h("div",{class:"crumbs"},h("button",{class:"back",onclick:function(){go("")},text:"← Все секции"})));
  v.appendChild(h("div",{class:"sechead"},h("div",{class:"num"+(s.num>9?" reg":""),text:String(s.num)}),

function api(method,url,body){
  return fetch(url,{method:method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined})
    .then(function(r){if(r.status===401){location.href="/login";throw new Error("auth");}
      return r.json().then(function(j){if(!r.ok)throw new Error(j&&j.error||("HTTP "+r.status));return j;});});
}
function sendPick(key){
  var p=myPicks[key];
  return api("PUT","/api/marks",{key:key,s:p?p.s:null,c:p?str(p.c):""}).then(function(){},function(e){if(e.message!=="auth")toast("Отметку сохранить не удалось, повторите");});
}
function setPick(key,s){
  if(s)myPicks[key]={s:s,c:myPicks[key]?str(myPicks[key].c):""};else delete myPicks[key];
  clearTimeout(pendingTimers[key]);dirty=true;
  sendPick(key).then(function(){dirty=false;});
}
function schedule(key){
  clearTimeout(pendingTimers[key]);dirty=true;
  pendingTimers[key]=setTimeout(function(){sendPick(key).then(function(){dirty=false;});},700);
}

/* ---------- инициализация ---------- */
var lastVersion=null;
function applyMarks(j){
  if(!j||j.same)return false;
  // пока своя запись не дошла до сервера, версию не запоминаем: иначе следующий опрос ответит «без изменений»
  // и решения/порядок коллег не подтянутся
  if(!dirty)lastVersion=j.version;var m={},names={};
  Object.keys(j.experts||{}).forEach(function(id){var e=j.experts[id];m[id]=e.picks||{};names[id]=str(e.name)||"Эксперт";});
  S.marks=m;S.names=names;
  if(!dirty){S.dec=j.decisions||{};S.order=j.order||{};S.secinfo=j.secinfo||{};}
  if(j.labels)S.labels=j.labels;
  if(S.me&&!dirty){var mine=m[S.me]||{};myPicks=JSON.parse(JSON.stringify(mine));}
  S.loaded.marks=true;return true;
}
function poll(){
  api("GET","/api/marks"+(lastVersion!=null?"?v="+lastVersion:"")).then(function(j){
    if(applyMarks(j)){var a=document.activeElement;if(!(a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT"||a.tagName==="SELECT")))render();}
    setStatus(S.statusText,false);
  },function(e){if(e.message!=="auth")setStatus("Нет связи с сервером, отметки других экспертов могут быть неактуальны.",true);});
}
function start(){
  Promise.all([api("GET","/api/me"),api("GET","/api/sections"),api("GET","/api/marks")]).then(function(r){
    var me=r[0];S.me=me.id;S.myName=str(me.name);S.admin=!!me.admin;S.secs=Array.isArray(me.secs)?me.secs:[];S.observer=!!me.observer;S.reviewSecs=Array.isArray(me.reviewSecs)?me.reviewSecs:[];
    S.sections=(Array.isArray(r[1])?r[1]:[]).filter(function(x){return x&&typeof x.num==="number"}).sort(function(a,b){return a.num-b.num});
    S.loaded.sec=true;applyMarks(r[2]);
    S.statusText=me.storage==="github"?"Отметки сохраняются автоматически и видны другим экспертам.":"Внимание: постоянное хранилище не настроено, отметки пропадут при перезапуске сервера.";
    setStatus(S.statusText,me.storage!=="github");
    var who=document.getElementById("who");who.textContent="";
    who.appendChild(h("span",{text:S.myName+(S.admin?" · администратор":(S.observer?" · наблюдатель"+((me.viewSecs||[]).length?", секция "+me.viewSecs.join(", "):"")+" (только просмотр)":(S.reviewSecs.length?" · помощник, секция "+S.reviewSecs.join(", "):(S.secs.length?" · куратор секции "+S.secs.join(", "):""))))}));
    who.appendChild(h("button",{class:"back",text:"Выйти",onclick:function(){api("POST","/api/logout").then(function(){location.href="/login";},function(){location.href="/login";});}}));
    render();
    setInterval(function(){if(!document.hidden)poll();},8000);
    document.addEventListener("visibilitychange",function(){if(!document.hidden)poll();});
  },function(e){if(e.message!=="auth"){S.loaded.sec=true;setStatus("Не удалось загрузить данные: "+e.message,true);render();}});
}
start();
})();
</script>
</body>
</html>
