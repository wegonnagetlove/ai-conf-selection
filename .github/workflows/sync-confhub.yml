name: Синхронизация с порталом «Ломоносов»

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/sync-request']

permissions:
  contents: write

concurrency:
  group: sync-confhub
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Проверка доступа к порталу
        run: curl -sS -o /dev/null -w '%{http_code}\n' --max-time 60 https://confhub.ru/rus/event/10771/ || echo 'портал отвечает медленно'
      - name: LibreOffice и poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer poppler-utils fonts-dejavu fonts-liberation > /dev/null
      - name: Синхронизация
        run: python3 scripts/sync_confhub.py
      - name: Коммит
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add site/data/sections.json site/data/thesis_files.json site/data/changes.json site/data/late.json files 2>/dev/null || git add site/data/sections.json site/data/thesis_files.json files
          if git diff --cached --quiet; then echo "Изменений нет"; exit 0; fi
          N=$(python3 -c "import json;print(sum(len(s['reports']) for s in json.load(open('site/data/sections.json'))))")
          git commit -q -m "Синхронизация с порталом: $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M'), $N докладов"
          git push
